<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Illustration of a downtown storefront row on a brick-paved main street">
  <title>Illustration — Main Street storefronts</title>
  <desc>An original flat vector illustration used as a decorative card image for the business directory. Not a photograph.</desc>
  <rect width="800" height="600" fill="#F3F9FC"/>
  <path d="M0 430h800v170H0z" fill="#EDF1F3"/>
  <path d="M0 470h800v130H0z" fill="#DCE3E7"/>
  <g stroke="#9AA9B2" stroke-width="3">
    <path d="M60 470v130M200 470v130M340 470v130M480 470v130M620 470v130M760 470v130"/>
  </g>
  <!-- storefront row -->
  <g>
    <rect x="40" y="240" width="150" height="192" fill="#9C3D22"/>
    <rect x="216" y="212" width="164" height="220" fill="#7A2E18"/>
    <rect x="406" y="248" width="150" height="184" fill="#B8543A"/>
    <rect x="582" y="222" width="178" height="210" fill="#9C3D22"/>
  </g>
  <g fill="#FAEDE7">
