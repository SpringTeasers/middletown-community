    <rect x="216" y="212" width="164" height="16"/>
    <rect x="406" y="248" width="150" height="16"/>
    <rect x="582" y="222" width="178" height="16"/>
  </g>
  <!-- awnings -->
  <g>
    <path d="M40 256h150l-14 34H54z" fill="#124A66"/>
    <path d="M216 228h164l-16 36H232z" fill="#2F6B4F"/>
    <path d="M406 264h150l-14 34H420z" fill="#8A6412"/>
    <path d="M582 238h178l-16 36H598z" fill="#124A66"/>
  </g>
  <!-- shop windows and doors -->
  <g fill="#E4F1F7">
    <rect x="56" y="306" width="56" height="72"/>
    <rect x="126" y="306" width="48" height="72"/>
    <rect x="236" y="286" width="60" height="84"/>
    <rect x="312" y="286" width="52" height="84"/>
    <rect x="422" y="314" width="54" height="72"/>
    <rect x="490" y="314" width="52" height="72"/>
    <rect x="598" y="296" width="62" height="84"/>
    <rect x="676" y="296" width="68" height="84"/>
  </g>
  <g fill="#33454F">
    <rect x="126" y="386" width="48" height="46"/>
