  <path d="M0 300c140-40 240 20 380 0s240-46 420-22v140H0z" fill="#8FC5DA"/>
  <path d="M0 366c160-30 260 16 400 2s240-34 400-18v250H0z" fill="#2F6B4F"/>
  <path d="M0 412c150-24 260 12 400 2s240-28 400-16v202H0z" fill="#3F8563"/>
